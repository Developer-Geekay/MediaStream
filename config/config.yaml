app:
  host: "0.0.0.0"
  port: 8080
  secret_key: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_SECRET"
  token_expire_minutes: 1440

media:
  root_path: "./media"
  allowed_extensions:
    - .mp4
    - .mkv
    - .avi
    - .mov
    - .mp3
    - .flac
    - .wav
    - .aac
    - .jpg
    - .jpeg
    - .png
    - .gif

ftp:
  enabled: true
  host: "0.0.0.0"
  port: 2121
  passive_ports_start: 60000
  passive_ports_end: 60100
  tls_enabled: true
  tls_cert: "./certs/server.crt"
  tls_key: "./certs/server.key"
  max_connections: 50
  max_connections_per_ip: 5

smb:
  enabled: true
  host: "0.0.0.0"
  # Port 4450 avoids conflicts with the OS built-in SMB (445).
  # Windows: Map Network Drive using \\<ip>:4450\MEDIAFILES
  # macOS:   Finder → Go → Connect to Server → smb://<ip>:4450/MEDIAFILES
  # Linux:   smbclient //<ip>/MEDIAFILES -p 4450 -U <user>
  port: 4450
  workgroup: "MEDIASTREAM"
  share_name: "MEDIAFILES"

dlna:
  enabled: true
  friendly_name: "MediaStream"
  http_port: 8200
  # SSDP discovery uses UDP multicast on 239.255.255.250:1900
  # Binding port 1900 may require elevated privileges on Linux/macOS.
  # If it fails the HTTP server still works; add the description URL manually.
  ssdp_port: 1900
