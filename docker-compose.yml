version: "3.9"

services:
  mediastream:
    build: .
    container_name: mediastream
    restart: unless-stopped
    ports:
      - "8080:8080"      # Web UI + API
      - "2121:2121"      # FTP control
      - "8200:8200"      # DLNA HTTP
      - "1900:1900/udp"  # SSDP / DLNA discovery
      - "60000-60100:60000-60100"  # FTP passive mode
    volumes:
      - ./media:/app/media          # Media files
      - ./config:/app/config        # Config + users DB
      - ./certs:/app/certs          # TLS certificates
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin1234}
      - MEDIASTREAM_SECRET_KEY=${SECRET_KEY:-change_me_in_production}
    network_mode: host   # Required for DLNA SSDP multicast discovery
    cap_add:
      - NET_BIND_SERVICE  # Allow binding port 1900

  # Optional: run Samba as a separate container
  # samba:
  #   image: dperson/samba
  #   restart: unless-stopped
  #   ports:
  #     - "139:139"
  #     - "445:445"
  #   volumes:
  #     - ./media:/media:ro
  #   command: -u "admin;admin1234" -s "MediaFiles;/media;yes;no;no;admin"
