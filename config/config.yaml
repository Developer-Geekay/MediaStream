app:
  host: "0.0.0.0"
  port: 8080
  secret_key: "CHANGE_ME_IN_PRODUCTION_USE_STRONG_SECRET"
  token_expire_minutes: 1440

media:
  root_path: "./media"
  allowed_extensions:
    - .mp4
    - .mkv
    - .avi
    - .mov
    - .mp3
    - .flac
    - .wav
    - .aac
    - .jpg
    - .jpeg
    - .png
    - .gif

ftp:
  enabled: true
  host: "0.0.0.0"
  port: 2121
  passive_ports_start: 60000
  passive_ports_end: 60100
  tls_enabled: true
  tls_cert: "./certs/server.crt"
  tls_key: "./certs/server.key"
  max_connections: 50
  max_connections_per_ip: 5

smb:
  enabled: true
  workgroup: "MEDIASTREAM"
  server_string: "MediaStream Server"
  share_name: "MediaFiles"
  config_path: "/etc/samba/smb.conf"

dlna:
  enabled: true
  server_name: "MediaStream DLNA"
  port: 1900
  http_port: 8200
  friendly_name: "MediaStream"
