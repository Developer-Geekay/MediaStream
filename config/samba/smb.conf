# Auto-generated by MediaStream — do not edit manually

[global]
    workgroup     = MEDIASTREAM
    server string = MediaStream
    netbios name  = MEDIASTREAM

    # ── Protocol ──────────────────────────────────────────
    # Enforce SMB2/3; refuse SMB1 connections entirely
    server min protocol = SMB2
    server max protocol = SMB3

    # Custom port avoids conflict with OS SMB on 445
    smb ports = 4450

    # ── Authentication ────────────────────────────────────
    # Guest access: unauthenticated clients land on nobody/guest
    security     = user
    map to guest = Bad User

    # ── Internal paths ────────────────────────────────────
    private dir     = /Users/gokulakannan/Projects/MediaStream/config/samba/private
    pid directory   = /Users/gokulakannan/Projects/MediaStream/config/samba
    lock directory  = /Users/gokulakannan/Projects/MediaStream/config/samba/lock
    state directory = /Users/gokulakannan/Projects/MediaStream/config/samba/state
    cache directory = /Users/gokulakannan/Projects/MediaStream/config/samba/cache

    # ── Logging ───────────────────────────────────────────
    log file   = /Users/gokulakannan/Projects/MediaStream/logs/smb.log
    log level  = 2
    max log size = 51200

    # ── Misc ──────────────────────────────────────────────
    load printers    = no
    printing         = bsd
    printcap name    = /dev/null
    disable spoolss  = yes
    unix extensions  = no

[VIDO]
    comment     = MediaStream — vido
    path        = /Users/gokulakannan/Vdo
    guest ok    = yes
    read only   = yes
    browseable  = yes
    create mask = 0644
    directory mask = 0755

[MEDIAFILES]
    comment    = MediaStream Files
    path       = /Users/gokulakannan/Vdo
    guest ok   = yes
    read only  = yes
    browseable = yes
